<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="body">
    <button id="openBookDialog">new Book</button>
    <dialog id="newBookDialog" closedby="any">
      <form method="dialog" id="newBookForm">
        <label for="bookTitle">Title:</label>
        <input type="text" name="bookTitle" id="bookTitle" required />

        <label for="bookAuthor">Author:</label>
        <input type="text" name="bookAuthor" id="bookAuthor" required />

        <label for="bookPageCount">Page count:</label>
        <input
          type="number"
          name="bookPageCount"
          id="bookPageCount"
          min="1"
          required
        />

        <input type="text" name="bookID" id="bookID" hidden />

        <label for="bookRead">Read:</label>
        <input type="radio" name="bookReadStatus" id="bookRead" value="Read" />

        <label for="bookUnread">Unread:</label>
        <input
          type="radio"
          name="bookReadStatus"
          id="bookUnread"
          value="Unread"
          checked
        />

        <button class="newBookFormBtn" id="formSubmit">Submit</button>

        <button class="newBookFormBtn" id="formClose">Close</button>
      </form>
    </dialog>
    <script src="javascript.js"></script>
  </body>
</html>
